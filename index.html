<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APS&C E-Attendance Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 750px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #1b4d3e; padding-bottom: 15px; margin-bottom: 20px; }
        .header h2 { color: #1b4d3e; margin: 0 0 5px 0; font-size: 20px; }
        .header p { margin: 3px 0; font-size: 13px; color: #555; }
        
        .controls { margin-bottom: 20px; }
        .control-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .control-group { flex: 1; min-width: 200px; }
        .control-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #1b4d3e; }
        .control-group input, .control-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }

        /* Quick Touch Class Buttons */
        .class-buttons-container { margin-bottom: 20px; }
        .class-buttons-container label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 13px; color: #1b4d3e; }
        .class-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .class-btn { padding: 10px 15px; background: #eef2f3; border: 1px solid #1b4d3e; color: #1b4d3e; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .class-btn.active { background: #1b4d3e; color: white; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 14px; }
        th { background-color: #1b4d3e; color: white; }
        td select { padding: 5px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }

        .summary-card { background: #eef2f3; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-around; text-align: center; }
        .summary-item h4 { margin: 0 0 5px 0; color: #1b4d3e; font-size: 13px; }
        .summary-item p { margin: 0; font-size: 16px; font-weight: bold; }

        .btn-container { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; text-align: center; }
        .btn-whatsapp { background: #28a745; }
        .btn-pdf { background: #007bff; }
        .btn:hover { opacity: 0.9; }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .btn-container, .class-buttons-container, .control-row { display: none; }
            td select { border: none; appearance: none; background: transparent; font-weight: bold; }
        }
    </style>
</head>

    <div class="container">
        <div class="header">
            <h2>ARMY PUBLIC SCHOOL & COLLEGE</h2>
            <p>Faisal, Karachi - Senior Section</p>

        <div class="controls">

                <div class="control-group">
                    <label>Report Type:</label>
                    <select id="reportType">

                <div class="control-group">
                    <label>Select Date:</label>

            </div>
        </div>

        <!-- Touch Buttons for Today's Classes -->
        <div class="class-buttons-container">
            <label>Tap Your Class for Today:</label>

                <!-- Buttons will appear here dynamically -->
            </div>
        </div>

            <div class="summary-item">

            </div>
            <div class="summary-item">

        function updateDaySchedule() {
            let dateVal = document.getElementById('attendanceDate').value;
            let dateObj = dateVal ? new Date(dateVal) : new Date();
            let dayOfWeek = dateObj.getDay(); // 0: Sun, 1: Mon ... 5: Fri, 6: Sat

            let scheduled = timetable[dayOfWeek];
            if (!scheduled) {
                scheduled = [
                    {id: "XA", name: "Class X-A"}, {id: "XB", name: "Class X-B"}, {id: "XC", name: "Class X-C"}, {id: "XD", name: "Class X-D"}, {id: "XE", name: "Class X-E"},
                    {id: "IXA", name: "Class IX-A"}, {id: "IXB", name: "Class IX-B"}, {id: "IXC", name: "Class IX-C"}, {id: "IXD", name: "Class IX-D"}, {id: "IXE", name: "Class IX-E"}
                ];
            }

            let container = document.getElementById('classButtonsList');
            container.innerHTML = "";

            scheduled.forEach((cls, index) => {
                let btn = document.createElement('button');
                btn.type = "button";
                btn.className = "class-btn" + (index === 0 ? " active" : "");
                btn.innerText = cls.name;
                btn.onclick = function() {
                    document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeClassId = cls.id;
                    loadStudents(cls.id);
                };
                container.appendChild(btn);
            });

            if (scheduled.length > 0) {
                activeClassId = scheduled[0].id;
                loadStudents(activeClassId);
            }
        }

        function loadStudents(classKey) {
            let list = studentsData[classKey] || [];
            let tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = "";

            list.forEach((student) => {
                let row = `<tr>
                    <td>${student.roll}</td>
                    <td>${student.name}</td>
                    <td>
                        <select class="status-select" onchange="updateSummary()">
                            <option value="Present">Present</option>
                            <option value="Absent">Absent</option>
                            <option value="Leave">Leave</option>
                        </select>
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });
            updateSummary();
        }

        function updateSummary() {
            let selects = document.querySelectorAll('.status-select');
            let total = selects.length;
            let present = 0;
            let absent = 0;

            selects.forEach(select => {
                if (select.value === 'Present') present++;
                else if (select.value === 'Absent' || select.value === 'Leave') absent++;
            });

            document.getElementById('totalCount').innerText = total;
            document.getElementById('presentCount').innerText = present;
            document.getElementById('absentCount').innerText = absent;
        }

        function shareWhatsApp() {

            let present = document.getElementById('presentCount').innerText;
            let absent = document.getElementById('absentCount').innerText;

            report += `🏫 *Class:* ${className}\n`;
            report += `📌 *Type:* ${type}\n`;

            report += `👥 *Total Students:* ${total}\n`;
            report += `✅ *Present:* ${present}\n`;
            report += `❌ *Absent/Leave:* ${absent}\n\n`;
