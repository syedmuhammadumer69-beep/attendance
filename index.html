<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APS&C E-Attendance Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #1b4d3e; padding-bottom: 15px; margin-bottom: 20px; }
        .header h2 { color: #1b4d3e; margin: 0 0 5px 0; font-size: 22px; }
        .header p { margin: 3px 0; font-size: 14px; color: #555; }
        
        .controls { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .control-group { flex: 1; min-width: 200px; }
        .control-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #1b4d3e; }
        .control-group input, .control-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
        th { background-color: #1b4d3e; color: white; }
        td select { padding: 5px; border-radius: 4px; border: 1px solid #ccc; }

        .summary-card { background: #eef2f3; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-around; text-align: center; }
        .summary-item h4 { margin: 0 0 5px 0; color: #1b4d3e; font-size: 14px; }
        .summary-item p { margin: 0; font-size: 18px; font-weight: bold; }

        .btn-container { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; text-align: center; }
        .btn-whatsapp { background: #28a745; }
        .btn-pdf { background: #007bff; }
        .btn:hover { opacity: 0.9; }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .btn-container, .controls { display: none; }
            td select { border: none; appearance: none; background: transparent; font-weight: bold; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>ARMY PUBLIC SCHOOL & COLLEGE</h2>
            <p>Faisal, Karachi - Senior Section</p>
            <p><b>Subject:</b> Tarjuma-tul-Quran / Islamiyat | <b>Teacher:</b> Syed Muhammad Umer Fareed</p>
            <p style="margin-top: 8px; font-size: 16px; color: #1b4d3e; font-weight: bold;">E-ATTENDANCE PORTAL</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Report Type:</label>
                <select id="reportType">
                    <option value="Daily">Daily Report</option>
                    <option value="Weekly">Weekly Report</option>
                    <option value="Monthly">Monthly Report</option>
                </select>
            </div>
            <div class="control-group">
                <label>Select Date:</label>
                <input type="date" id="attendanceDate">
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-item">
                <h4>Total Students</h4>
                <p id="totalCount">3</p>
            </div>
            <div class="summary-item">
                <h4>Present</h4>
                <p id="presentCount" style="color: green;">3</p>
            </div>
            <div class="summary-item">
                <h4>Absent</h4>
                <p id="absentCount" style="color: red;">0</p>
            </div>
        </div>

        <table id="attendanceTable">
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Student Name</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>01</td>
                    <td>Ahmad Ali</td>
                    <td>
                        <select class="status-select" onchange="updateSummary()">
                            <option value="Present">Present</option>
                            <option value="Absent">Absent</option>
                            <option value="Leave">Leave</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>02</td>
                    <td>Muhammad Umer</td>
                    <td>
                        <select class="status-select" onchange="updateSummary()">
                            <option value="Present">Present</option>
                            <option value="Absent">Absent</option>
                            <option value="Leave">Leave</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>03</td>
                    <td>Hassan Raza</td>
                    <td>
                        <select class="status-select" onchange="updateSummary()">
                            <option value="Present">Present</option>
                            <option value="Absent">Absent</option>
                            <option value="Leave">Leave</option>
                        </select>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="btn-container">
            <button class="btn btn-whatsapp" onclick="shareWhatsApp()">Share via WhatsApp</button>
            <button class="btn btn-pdf" onclick="downloadPDF()">Download / Print PDF</button>
        </div>
    </div>

    <script>
        // Set today's date automatically
        document.getElementById('attendanceDate').valueAsDate = new Date();

        function updateSummary() {
            let selects = document.querySelectorAll('.status-select');
            let total = selects.length;
            let present = 0;
            let absent = 0;

            selects.forEach(select => {
                if (select.value === 'Present') present++;
                else if (select.value === 'Absent' || select.value === 'Leave') absent++;
            });

            document.getElementById('totalCount').innerText = total;
            document.getElementById('presentCount').innerText = present;
            document.getElementById('absentCount').innerText = absent;
        }

        function shareWhatsApp() {
            let date = document.getElementById('attendanceDate').value;
            let type = document.getElementById('reportType').value;
            let total = document.getElementById('totalCount').innerText;
            let present = document.getElementById('presentCount').innerText;
            let absent = document.getElementById('absentCount').innerText;

            let report = `📋 *APS&C E-Attendance Report* 📋\n`;
            report += `📌 *Type:* ${type}\n`;
            report += `📅 *Date:* ${date}\n\n`;
            report += `👥 *Total Students:* ${total}\n`;
            report += `✅ *Present:* ${present}\n`;
            report += `❌ *Absent/Leave:* ${absent}\n\n`;
            report += `Teacher: Syed Muhammad Umer Fareed\n`;
            report += `Army Public School & College, Karachi`;

            let url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(report);
            window.open(url, "_blank");
        }

        function downloadPDF() {
            window.print();
        }
    </script>
</body>
</html>
